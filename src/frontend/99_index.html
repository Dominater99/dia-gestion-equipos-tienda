  <main class="app-main" id="mainContent">
    <section class="screen" id="screenNoAccess" aria-labelledby="noAccessTitle" hidden>
      <div class="notice-card">
        <h2 class="notice-card__title" id="noAccessTitle">No tienes acceso a esta aplicación</h2>
        <p class="notice-card__text" id="noAccessMessage">
          Tu usuario (<strong id="noAccessEmail"></strong>) todavía no está dado de alta.
        </p>
        <a class="button button--primary" id="requestAccessButton" href="#">Solicitar acceso</a>
      </div>
    </section>

    <section class="screen" id="screenHome" aria-labelledby="homeTitle" hidden>
      <header class="screen__header">
        <div>
          <p class="screen__eyebrow">Hola, <span id="homeUserName"></span></p>
          <h2 class="screen__title" id="homeTitle">¿Qué quieres gestionar?</h2>
          <p class="screen__description">Elige un equipo para consultar las gestiones disponibles.</p>
        </div>
      </header>
      <div class="option-grid" id="equipmentGrid">
        <button class="option-card" type="button" data-equipment="NEVERA">
          <span class="option-card__icon" aria-hidden="true">N</span>
          <span>Nevera</span>
        </button>
        <button class="option-card" type="button" data-equipment="LOCKER">
          <span class="option-card__icon" aria-hidden="true">L</span>
          <span>Locker</span>
        </button>
        <button class="option-card" type="button" data-equipment="CAFETERA">
          <span class="option-card__icon" aria-hidden="true">C</span>
          <span>Cafetera</span>
        </button>
      </div>
    </section>

    <section class="screen" id="screenProvider" aria-labelledby="providerTitle" hidden>
      <header class="screen__header">
        <div>
          <p class="screen__eyebrow" id="providerBreadcrumb"></p>
          <h2 class="screen__title" id="providerTitle">Selecciona el proveedor</h2>
        </div>
        <button class="button button--secondary" type="button" data-back="home">Volver</button>
      </header>
      <div class="option-grid" id="providerGrid"></div>
    </section>

    <section class="screen" id="screenManagement" aria-labelledby="managementTitle" hidden>
      <header class="screen__header">
        <div>
          <p class="screen__eyebrow" id="managementBreadcrumb"></p>
          <h2 class="screen__title" id="managementTitle">¿Qué necesitas hacer?</h2>
        </div>
        <button class="button button--secondary" id="managementBackButton" type="button">Volver</button>
      </header>
      <div class="option-list" id="managementList"></div>
    </section>

    <section class="screen" id="screenForm" aria-labelledby="formTitle" hidden>
      <header class="screen__header">
        <div>
          <p class="screen__eyebrow" id="formBreadcrumb"></p>
          <h2 class="screen__title" id="formTitle"></h2>
        </div>
        <button class="button button--secondary" type="button" data-back="management">Volver</button>
      </header>
      <form class="form-card" id="requestForm" novalidate>
        <div id="formFields"></div>
        <button class="button button--primary button--block" id="submitButton" type="submit" disabled>
          Registrar solicitud
        </button>
      </form>
    </section>
  </main>

  <footer class="app-footer">

    </div>
  </dialog>
